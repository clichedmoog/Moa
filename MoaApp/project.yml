name: Moa
options:
  bundleIdPrefix: com.clichedmoog
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

# Release 와 ReleaseMAS 는 같은 코드를 다른 서명 체계로 낸다.
#   Release    — Developer ID + 공증, GitHub Release 로 직접 배포
#   ReleaseMAS — Apple Distribution + 프로비저닝 프로파일, Mac App Store
configs:
  Debug: debug
  Release: release
  ReleaseMAS: release

packages:
  MoaKit:
    path: ..

targets:
  Moa:
    type: application
    platform: macOS
    sources:
      - path: Moa
    dependencies:
      - package: MoaKit
        product: MoaKit
    info:
      path: Moa/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleName: Moa
        CFBundleDisplayName: Moa
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Myeongseok Seo"
        # 앱이 암호화를 쓰지 않음을 선언한다. 이게 없으면 App Store 에 올릴 때마다
        # 수출 규정 질문에 매번 답해야 한다. 모아는 네트워크도 암호화도 쓰지 않는다.
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
        # Finder 우클릭 → 서비스. NSMessage 는 ServicesProvider 의 @objc 메서드 이름과
        # 정확히 같아야 하고, 다르면 메뉴에는 나타나되 눌러도 아무 일이 없다.
        # NSRequiredContext 를 비워 두면 텍스트를 선택했을 때도 메뉴에 뜬다 — 파일에만
        # 의미가 있으므로 FilePath 로 좁힌다.
        NSServices:
          - NSMenuItem:
              default: "모아쓰기"
            NSMessage: normalizeNames
            NSPortName: Moa
            NSSendTypes:
              - public.file-url
            NSRequiredContext:
              NSTextContent: FilePath
        CFBundleDocumentTypes:
          - CFBundleTypeName: All Documents
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - public.item
            LSHandlerRank: None
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clichedmoog.Moa
        PRODUCT_NAME: Moa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        ARCHS: $(ARCHS_STANDARD)
        ONLY_ACTIVE_ARCH: "NO"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Moa/Moa.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: N9LYHMUDKA
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
        ReleaseMAS:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: N9LYHMUDKA
          PROVISIONING_PROFILE_SPECIFIER: "Moa Mac App Store"
          # 하드닝 런타임은 공증 요건이지 앱스토어 요건이 아니다. 켜 둬도
          # 해가 없지만, 앱스토어 심사는 프로파일과 샌드박스로 판단한다.
          ENABLE_HARDENED_RUNTIME: NO
          # 후원 메뉴를 이 빌드에서만 뺀다 — App Store Review Guideline 3.1.1
          # 은 IAP 외 결제 수단으로 유도하는 링크를 금지한다. 순수 후원은
          # 통과 사례도 반려 사례도 있어 예측이 안 되므로 아예 넣지 않는다.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAS"
